- title: Quantum theory based on real numbers can be experimentally falsified
  description: While complex numbers are essential in mathematics, they are not needed to describe physical experiments, expressed in terms of probabilities, hence real numbers. Physics however aims to explain, rather than describe, experiments through theories. While most theories of physics are based on real numbers, quantum theory was the first to be formulated in terms of operators acting on complex Hilbert spaces. This has puzzled countless physicists, including the fathers of the theory, for whom a real version of quantum theory, in terms of real operators, seemed much more natural. In fact, previous works showed that such \"real quantum theory\" can reproduce the outcomes of any multipartite experiment, as long as the parts share arbitrary real quantum states. Thus, are complex numbers really needed in the quantum formalism? Here, we show this to be case by proving that real and complex quantum theory make different predictions in network scenarios comprising independent states and measurements. This allows us to devise a Bell-like experiment whose successful realization would disprove real quantum theory, in the same way as standard Bell experiments disproved local physics. 
  authors: Marc-Olivier Renou, David Trillo, Mirjam Weilenmann, Thinh P. Le, Armin Tavakoli, Nicolas Gisin, Antonio Acin, Miguel Navascues
  link:
    url: https://www.nature.com/articles/s41586-021-04160-4
    display: Nature 600, 625-629 (2021)

- title: Unsupervised phase discovery with deep anomaly detection
  description: We demonstrate how to explore phase diagrams with automated and unsupervised machine learning to find regions of interest for possible new phases. In contrast to supervised learning, where data is classified using predetermined labels, we here perform anomaly detection, where the task is to differentiate a normal data set, composed of one or several classes, from anomalous data. Asa paradigmatic example, we explore the phase diagram of the extended Bose Hubbard model in one dimension at exact integer filling and employ deep neural networks to determine the entire phase diagram in a completely unsupervised and automated fashion. As input data for learning, we first use the entanglement spectra and central tensors derived from tensor-networks algorithms for ground-state computation and later we extend our method and use experimentally accessible data such as low-order correlation functions as inputs. Our method allows us to reveal a phase-separated region between supersolid and superfluid parts with unexpected properties, which appears in the system in addition to the standard superfluid, Mott insulator, Haldane-insulating, and density wave phases. 
  authors: Korbinian Kottmann, Patrick Huembeli, Maciej Lewenstein, Antonio Acin
  link:
    url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.125.170603
    display: Phys. Rev. Lett. 125, 170603 (2020)

- title: Connector tensor networks - a renormalization-type approach to quantum certification
  description: As quantum technologies develop, we acquire control of an ever-growing number of quantum systems. Unfortunately, current tools to detect relevant quantum properties of quantum states, such as entanglement and Bell nonlocality, suffer from severe scalability issues and can only be computed for systems of a very modest size, of around 6 sites. In order to address large many-body systems, we propose a renormalisation-type approach based on a class of local linear transformations, called connectors, which can be used to coarse-grain the system in a way that preserves the property under investigation. Repeated coarse-graining produces a system of manageable size, whose properties can then be explored by means of usual techniques for small systems. In case of a successful detection of the desired property, the method outputs a linear witness which admits an exact tensor network representation, composed of connectors. We demonstrate the power of our method by certifying using a normal desktop computer entanglement, Bell nonlocality and supra-quantum Bell nonlocality in systems with hundreds of sites. 
  authors: Miguel Navascues, Sukhbinder Singh, Antonio Acin
  link:
    url: https://journals.aps.org/prx/abstract/10.1103/PhysRevX.10.021064
    display: Phys. Rev. X 10, 021064 (2020)

- title: Bounding the Sets of Classical and Quantum Correlations in Networks
  description: We present a method that allows the study of classical and quantum correlations in networks with causally-independent parties, such as the scenario underlying entanglement swapping. By imposing relaxations of factorization constraints in a form compatible with semidefinite programming, it enables the use of the Navascués-Pironio-Acín hierarchy in complex quantum networks. We first show how the technique successfully identifies correlations not attainable in the entanglement-swapping scenario. Then we use it to show how the nonlocal power of measurements can be activated in a network - there exist measuring devices that, despite being unable to generate nonlocal correlations in the standard Bell scenario, provide a classical-quantum separation in an entanglement swapping configuration. 
  authors: Alejandro Pozas-Kerstjens, Rafael Rabelo, Łukasz Rudnicki, Rafael Chaves, Daniel Cavalcanti, Miguel Navascues, Antonio Acín
  link:
    url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.123.140503
    display: Phys. Rev. Lett. 123, 140503 (2019)

